name: Enhanced Daily Stock Evaluation

on:
  # Run daily at 11 PM UTC (6 PM EST / 7 PM EDT, after market close)
  # This allows time for after-hours data to settle and ensures we have complete daily data
  # Only runs on weekdays; holiday check is done in the job
  schedule:
    - cron: "0 23 * * 1-5" # Monday through Friday at 11 PM UTC

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      validated_pipeline_run:
        description: "Completed full validation run to release with upload_only; must match this commit or its merge parent"
        required: false
        default: ""
        type: string
      resume_pipeline_cache_key:
        description: "Optional retained pipeline validation cache key for resuming acquisition"
        required: false
        default: ""
        type: string
      resume_news_cache_run:
        description: "Optional completed validation run ID whose successful source evidence should be reused"
        required: false
        default: ""
        type: string
      pipeline_validation:
        description: "Complete isolated pipeline rehearsal; retains artifacts without publishing or messaging"
        required: false
        default: "none"
        type: choice
        options: ["none", "100", "full"]
      risk_shadow_scope:
        description: "Fresh provider acquisition and canonical risk validation only; no publication"
        required: false
        default: "none"
        type: choice
        options: ["none", "100", "500", "full"]
      news_shadow_scope:
        description: "Provider-backed news validation only; does not publish"
        required: false
        default: "none"
        type: choice
        options: ["none", "100", "500", "full"]
      upload_only:
        description: "Only upload existing results (skip evaluation)"
        required: false
        default: "false"
        type: boolean
      force_run:
        description: "Force run even on holidays"
        required: false
        default: "false"
        type: boolean
      date_override:
        description: "Run evaluation for a specific date (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      test_mode:
        description: "Run in test mode (process only 100 stocks)"
        required: false
        default: "false"
        type: boolean
      skip_social_scan:
        description: "Skip social media scanning phase"
        required: false
        default: "false"
        type: boolean

# Grant write permissions for issue creation on failure
concurrency:
  group: enhanced-daily-evaluation-${{ github.event.inputs.news_shadow_scope && github.event.inputs.news_shadow_scope != 'none' && 'news-validation' || github.event.inputs.pipeline_validation && github.event.inputs.pipeline_validation != 'none' && 'pipeline-validation' || github.event.inputs.risk_shadow_scope && github.event.inputs.risk_shadow_scope != 'none' && 'risk-validation' || 'production' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  check-trading-day:
    if: ${{ (!github.event.inputs.news_shadow_scope || github.event.inputs.news_shadow_scope == 'none') && (!github.event.inputs.risk_shadow_scope || github.event.inputs.risk_shadow_scope == 'none') && (!github.event.inputs.pipeline_validation || github.event.inputs.pipeline_validation == 'none') }}
    runs-on: ubuntu-latest
    outputs:
      is_trading_day: ${{ steps.check.outputs.is_trading_day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check the shared NYSE calendar
        id: check
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { marketSessionOnOrBefore } from './src/lib/market-publication-freshness.ts';
          const today = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
          }).format(new Date());
          const session = marketSessionOnOrBefore(today);
          if (session === null) throw new Error(`NYSE calendar unavailable for ${today}; refresh the shared calendar`);
          const trading = session === today;
          console.log(`${today}: ${trading ? 'trading session' : 'market closed'}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `is_trading_day=${trading}\n`);
          NODE

  enhanced-evaluation:
    needs: check-trading-day
    if: ${{ needs.check-trading-day.outputs.is_trading_day == 'true' || github.event.inputs.force_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~5h50m — GitHub-hosted runners cap jobs at 6h

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npx prisma generate
          npm run typecheck:pipeline

      - name: Validate required secrets
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL }}
          AI_API_SECRET: ${{ secrets.AI_API_SECRET }}
          SOCIAL_SCAN_APP_URL: ${{ secrets.SOCIAL_SCAN_APP_URL }}
          SOCIAL_SCAN_API_KEY: ${{ secrets.SOCIAL_SCAN_API_KEY }}
          SOCIAL_SCAN_INGEST_KEY: ${{ secrets.SOCIAL_SCAN_INGEST_KEY }}
        run: |
          MISSING=""
          if [ -z "$FMP_API_KEY" ]; then MISSING="$MISSING FMP_API_KEY"; fi
          if [ -z "$DATA_REPO_TOKEN" ]; then MISSING="$MISSING DATA_REPO_TOKEN"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            echo "Please configure these in Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY not set - Phase 3 news filtering will be SKIPPED, inflating HIGH-risk counts"
          else
            echo "OPENAI_API_KEY configured for AI-powered analysis"
          fi
          if [ -n "$SOCIAL_SCAN_APP_URL" ] && [ -n "$SOCIAL_SCAN_API_KEY" ]; then
            echo "Social scan: Deployed API configured → results go to Supabase + AI screening"
          else
            echo "::warning::SOCIAL_SCAN_APP_URL or SOCIAL_SCAN_API_KEY not set - social scan will use local fallback (no AI screening; publication checked separately)"
          fi
          if [ -n "$SOCIAL_SCAN_APP_URL" ] && [ -n "$SOCIAL_SCAN_INGEST_KEY" ]; then
            echo "Local fallback publication configured; server-confirmed receipt will be retained"
          else
            echo "::warning::Local social fallback publication unavailable; raw evidence will be retained with degraded publication status"
          fi
          if [ -n "$AI_BACKEND_URL" ] && [ -z "$AI_API_SECRET" ]; then
            echo "::warning::AI_BACKEND_URL is set but AI_API_SECRET is missing - Python AI backend requests will fail auth"
          fi
          echo "All required secrets are configured"

      - name: Determine evaluation date
        id: date
        run: |
          DATE="${{ github.event.inputs.date_override }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Evaluation date: $DATE"

      - name: Import the exact completed full validation output
        if: ${{ github.event.inputs.upload_only == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN_ID: ${{ github.event.inputs.validated_pipeline_run }}
          RELEASE_DATE: ${{ steps.date.outputs.date }}
        run: |
          [[ "$VALIDATED_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN_ID" > "$RUNNER_TEMP/validated-run.json"
          gh run download "$VALIDATED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "pipeline-validation-full-$VALIDATED_RUN_ID" --dir "$RUNNER_TEMP/validated-pipeline"
          npx ts-node --project evaluation/tsconfig.json evaluation/scripts/import-validated-pipeline.ts "$RUNNER_TEMP/validated-run.json" "$RUNNER_TEMP/validated-pipeline" "$RELEASE_DATE"

      - name: Restore news evidence, decisions and spending ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            evaluation/results/news-cache
            evaluation/results/news-decisions
            evaluation/results/news-cost-ledger-*.jsonl
          key: news-review-v3-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-review-v3-${{ steps.date.outputs.date }}-

      - name: Run Enhanced Daily Pipeline
        if: ${{ github.event.inputs.upload_only != 'true' }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL }}
          AI_API_SECRET: ${{ secrets.AI_API_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SOCIAL_SCAN_APP_URL: ${{ secrets.SOCIAL_SCAN_APP_URL }}
          SOCIAL_SCAN_API_KEY: ${{ secrets.SOCIAL_SCAN_API_KEY }}
          SOCIAL_SCAN_INGEST_KEY: ${{ secrets.SOCIAL_SCAN_INGEST_KEY }}
          EVALUATION_DATE: ${{ steps.date.outputs.date }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        run: |
          cd evaluation
          echo "Starting Enhanced Daily Pipeline for $EVALUATION_DATE..."
          echo "Test Mode: $TEST_MODE"

          if [ -n "$AI_BACKEND_URL" ]; then
            echo "Python AI Backend: $AI_BACKEND_URL (accepted layers reported per result)"
          else
            echo "Python AI Backend: Not configured (using Layer 1 only)"
          fi

          if [ -n "$SOCIAL_SCAN_APP_URL" ] && [ -n "$SOCIAL_SCAN_API_KEY" ]; then
            echo "Social Scan: Deployed API → Supabase + AI screening"
          else
            echo "Social Scan: Local fallback (JSON only)"
          fi

          node ../node_modules/ts-node/dist/bin.js --project tsconfig.json scripts/enhanced-daily-pipeline.ts &
          PIPELINE_PID=$!
          trap 'kill -TERM "$PIPELINE_PID" 2>/dev/null || true; wait "$PIPELINE_PID" 2>/dev/null || true' INT TERM EXIT
          wait "$PIPELINE_PID"

          echo "Enhanced pipeline complete"

      - name: Generate Scheme Report
        if: ${{ github.event.inputs.upload_only != 'true' }}
        env:
          EVALUATION_DATE: ${{ steps.date.outputs.date }}
        run: |
          cd evaluation
          echo "Generating scheme tracking report..."
          npx ts-node scripts/scheme-tracker.ts report $EVALUATION_DATE
          echo "Scheme report generated"

      - name: Validate pipeline output
        if: ${{ github.event.inputs.upload_only != 'true' }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          cd evaluation

          echo "Validating pipeline output for ${DATE}..."

          # Define expected files with categories
          declare -A EXPECTED_FILES
          EXPECTED_FILES=(
            ["enhanced-evaluation"]="results/enhanced-evaluation-${DATE}.json"
            ["enhanced-high-risk"]="results/enhanced-high-risk-${DATE}.json"
            ["suspicious-stocks"]="results/suspicious-stocks-${DATE}.json"
            ["daily-report"]="results/daily-report-${DATE}.json"
            ["fmp-summary"]="results/fmp-summary-${DATE}.json"
            ["social-media-scan"]="results/social-media-scan-${DATE}.json"
            ["promoted-stocks"]="results/promoted-stocks-${DATE}.json"
            ["scan-status"]="results/scan-status-${DATE}.json"
            ["otc-coverage"]="results/otc-coverage-${DATE}.json"
            ["scheme-database"]="scheme-database/scheme-database.json"
          )

          TOTAL=0
          PRESENT=0
          MISSING_LIST=""
          FILE_DETAILS="["

          for key in "${!EXPECTED_FILES[@]}"; do
            filepath="${EXPECTED_FILES[$key]}"
            TOTAL=$((TOTAL + 1))

            if [ -f "$filepath" ]; then
              PRESENT=$((PRESENT + 1))
              SIZE=$(stat -c%s "$filepath" 2>/dev/null || echo "0")
              echo "  [PASS] $key ($SIZE bytes)"
              FILE_DETAILS="${FILE_DETAILS}{\"name\":\"${key}\",\"file\":\"$(basename $filepath)\",\"status\":\"present\",\"sizeBytes\":${SIZE}},"
            else
              echo "  [FAIL] $key - MISSING: $filepath"
              MISSING_LIST="${MISSING_LIST} ${key}"
              FILE_DETAILS="${FILE_DETAILS}{\"name\":\"${key}\",\"file\":\"$(basename $filepath)\",\"status\":\"missing\",\"sizeBytes\":0},"
            fi
          done

          # Remove trailing comma and close array
          FILE_DETAILS="${FILE_DETAILS%,}]"

          # Determine overall status
          if [ $PRESENT -eq $TOTAL ]; then
            STATUS="healthy"
            echo ""
            echo "Pipeline validation PASSED: All ${TOTAL} files present"
          elif [ $PRESENT -ge $((TOTAL - 2)) ]; then
            STATUS="degraded"
            echo ""
            echo "::warning::Pipeline validation DEGRADED: ${PRESENT}/${TOTAL} files present, missing:${MISSING_LIST}"
          else
            STATUS="failing"
            echo ""
            echo "::error::Pipeline validation FAILED: ${PRESENT}/${TOTAL} files present, missing:${MISSING_LIST}"
          fi

          # File presence alone is not a promotion gate. The pipeline can
          # intentionally retain candidates as suspicious when a bounded news
          # analysis cannot classify them; expose that as degraded instead of
          # reporting a healthy scan.
          SCAN_STATUS_FILE="results/scan-status-${DATE}.json"
          SCAN_PIPELINE_STATUS="unknown"
          if [ -f "$SCAN_STATUS_FILE" ]; then
            SCAN_PIPELINE_STATUS=$(jq -r '.pipelineStatus // "unknown"' "$SCAN_STATUS_FILE" 2>/dev/null || echo "unknown")
            if [ "$SCAN_PIPELINE_STATUS" = "degraded" ] && [ "$STATUS" = "healthy" ]; then
              STATUS="degraded"
              echo "::warning::Pipeline output is intentionally DEGRADED; inspect scan-status details before promotion"
            elif [ "$SCAN_PIPELINE_STATUS" = "failed" ]; then
              STATUS="failing"
              echo "::error::Pipeline reported FAILED in scan-status"
            fi
          else
            echo "::warning::scan-status is missing; output cannot be promoted as healthy"
            if [ "$STATUS" = "healthy" ]; then STATUS="degraded"; fi
          fi

          # Check scheme database health
          SCHEME_STATUS="unknown"
          ACTIVE_SCHEMES=0
          TOTAL_SCHEMES=0
          if [ -f "scheme-database/scheme-database.json" ]; then
            ACTIVE_SCHEMES=$(cat scheme-database/scheme-database.json | jq -r '.activeSchemes // 0' 2>/dev/null || echo "0")
            TOTAL_SCHEMES=$(cat scheme-database/scheme-database.json | jq -r '.totalSchemes // 0' 2>/dev/null || echo "0")
            LAST_UPDATED=$(cat scheme-database/scheme-database.json | jq -r '.lastUpdated // "unknown"' 2>/dev/null || echo "unknown")
            SCHEME_STATUS="active"
            echo "  Scheme DB: ${ACTIVE_SCHEMES} active / ${TOTAL_SCHEMES} total (updated: ${LAST_UPDATED})"
          fi

          # Write validation report
          cat > "results/pipeline-validation-${DATE}.json" <<EOFVAL
          {
            "date": "${DATE}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "${STATUS}",
            "scanPipelineStatus": "${SCAN_PIPELINE_STATUS}",
            "filesExpected": ${TOTAL},
            "filesPresent": ${PRESENT},
            "filesMissing": $((TOTAL - PRESENT)),
            "missingFiles": "$(echo ${MISSING_LIST} | xargs)",
            "files": ${FILE_DETAILS},
            "schemeTracking": {
              "status": "${SCHEME_STATUS}",
              "activeSchemes": ${ACTIVE_SCHEMES},
              "totalSchemes": ${TOTAL_SCHEMES}
            },
            "workflowRun": "${{ github.run_id }}",
            "workflowUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOFVAL

          echo ""
          echo "Validation report written to results/pipeline-validation-${DATE}.json"

      - name: Upload to Supabase
        if: ${{ github.event.inputs.test_mode != 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTIFACT_PRODUCER_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          DATE="${{ steps.date.outputs.date }}"

          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Supabase credentials not configured; publication failed"
            echo "Set NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets to enable"
            exit 1
          fi

          cd evaluation
          npx ts-node scripts/upload-to-supabase.ts "$DATE"

      - name: Checkout data repository
        if: ${{ github.event.inputs.test_mode != 'true' }}
        continue-on-error: true
        id: checkout-data
        uses: actions/checkout@v4
        with:
          repository: Elimiz21/scam-dunk-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Copy results to data repository
        if: steps.checkout-data.outcome == 'success'
        run: |
          DATE="${{ steps.date.outputs.date }}"

          # Ensure directories exist
          mkdir -p data-repo/evaluation-results 
          mkdir -p data-repo/daily-summaries 
          mkdir -p data-repo/comparison-reports 
          mkdir -p data-repo/promoted-stocks 
          mkdir -p data-repo/social-media-scans
          mkdir -p data-repo/suspicious-stocks
          mkdir -p data-repo/scheme-tracking
          mkdir -p data-repo/reports

          cp evaluation/results/otc-coverage-${DATE}.json data-repo/reports/ 2>/dev/null || true

          # Copy enhanced evaluation results
          cp evaluation/results/enhanced-evaluation-${DATE}.json data-repo/evaluation-results/ 2>/dev/null || true
          cp evaluation/results/enhanced-high-risk-${DATE}.json data-repo/evaluation-results/ 2>/dev/null || true

          # Copy legacy format for backwards compatibility
          cp evaluation/results/fmp-evaluation-${DATE}.json data-repo/evaluation-results/ 2>/dev/null || true
          cp evaluation/results/fmp-high-risk-${DATE}.json data-repo/evaluation-results/ 2>/dev/null || true
          cp evaluation/results/fmp-summary-${DATE}.json data-repo/daily-summaries/ 2>/dev/null || true

          # Copy suspicious stocks and scheme data
          cp evaluation/results/suspicious-stocks-${DATE}.json data-repo/suspicious-stocks/ 2>/dev/null || true
          cp evaluation/results/daily-report-${DATE}.json data-repo/reports/ 2>/dev/null || true

          # Copy scheme tracking data (scheme + promoter databases)
          cp evaluation/scheme-database/scheme-database.json data-repo/scheme-tracking/ 2>/dev/null || true
          cp evaluation/scheme-database/promoter-database.json data-repo/scheme-tracking/ 2>/dev/null || true
          cp evaluation/results/scheme-report-${DATE}.md data-repo/scheme-tracking/ 2>/dev/null || true

          # Copy social media scans
          cp evaluation/results/social-media-scan-${DATE}.json data-repo/social-media-scans/ 2>/dev/null || true
          cp evaluation/results/social-scan-${DATE}.json data-repo/social-media-scans/ 2>/dev/null || true
          cp evaluation/results/social-ingest-request-${DATE}.json data-repo/social-media-scans/ 2>/dev/null || true
          cp evaluation/results/social-ingest-publication-${DATE}.json data-repo/social-media-scans/ 2>/dev/null || true
          cp evaluation/results/social-media-scan-*.md data-repo/social-media-scans/ 2>/dev/null || true

          # Copy comparison reports
          cp evaluation/results/comparison-${DATE}.json data-repo/comparison-reports/ 2>/dev/null || true

          # Copy promoted stocks
          cp evaluation/results/promoted-stocks-${DATE}.json data-repo/promoted-stocks/ 2>/dev/null || true

          # List what was copied
          echo "Files in data-repo:"
          find data-repo -name "*${DATE}*" -type f 2>/dev/null | sort

      - name: Skip data repo notice
        if: steps.checkout-data.outcome != 'success'
        run: |
          echo "::warning::Skipping data repository push - DATA_REPO_TOKEN may be expired or invalid"
          echo "Results are still saved as artifacts. Please update the DATA_REPO_TOKEN secret."

      - name: Commit results to data repository
        if: steps.checkout-data.outcome == 'success'
        run: |
          cd data-repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new evaluation results to commit"
          else
            DATE="${{ steps.date.outputs.date }}"
            git commit -m "Add enhanced evaluation results for ${DATE}"
            git push
            echo "Results pushed to scam-dunk-data repository"
          fi

      - name: Save resumable news evidence, decisions and spending ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            evaluation/results/news-cache
            evaluation/results/news-decisions
            evaluation/results/news-cost-ledger-*.jsonl
          key: news-review-v3-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-evaluation-results-${{ github.run_number }}
          path: |
            evaluation/results/*.json
            evaluation/results/*.md
            evaluation/results/*.jsonl
            evaluation/results/news-cache/*.json
            evaluation/results/news-decisions/*.json
            evaluation/scheme-database/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "## Enhanced Daily Evaluation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "evaluation/results/daily-report-${DATE}.json" ]; then
            echo "### Results" >> $GITHUB_STEP_SUMMARY
            cat evaluation/results/daily-report-${DATE}.json | jq -r '
              "- **Total Stocks Scanned:** \(.totalStocksScanned)",
              "- **High Risk (Before Filters):** \(.highRiskBeforeFilters)",
              "- **Filtered by Market Cap:** \(.filteredByMarketCap)",
              "- **Filtered by Volume:** \(.filteredByVolume)",
              "- **Filtered by News:** \(.filteredByNews)",
              "- **Remaining Suspicious:** \(.remainingSuspicious)",
              "- **Active Schemes:** \(.activeSchemes)",
              "- **New Schemes Detected:** \(.newSchemes)",
              "- **Processing Time:** \(.processingTimeMinutes) minutes"
            ' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Unable to parse report" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for full results." >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    needs: enhanced-evaluation
    runs-on: ubuntu-latest
    if: ${{ failure() && (!github.event.inputs.news_shadow_scope || github.event.inputs.news_shadow_scope == 'none') && (!github.event.inputs.risk_shadow_scope || github.event.inputs.risk_shadow_scope == 'none') && (!github.event.inputs.pipeline_validation || github.event.inputs.pipeline_validation == 'none') }}
    permissions:
      issues: write
    steps:
      - name: Send failure email alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "$RESEND_API_KEY" ]; then
            echo "Warning: RESEND_API_KEY not set, skipping email notification"
            exit 0
          fi

          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"ScamDunk Alerts <noreply@scamdunk.com>\",
              \"to\": [\"elimizroch@gmail.com\"],
              \"subject\": \"🚨 ALERT: Daily Stock Scan FAILED - ${DATE}\",
              \"html\": \"<h2>Daily Stock Evaluation Failed</h2><p>The enhanced daily stock scanning pipeline failed on <strong>${DATE}</strong>.</p><p><strong>What this means:</strong> No new pump-and-dump schemes were scanned today. Active scheme tracking is paused until this is resolved.</p><h3>Actions Required:</h3><ol><li>Check the <a href='${WORKFLOW_URL}'>workflow logs</a> for error details</li><li>Re-run the workflow manually if needed</li><li>Verify API keys (FMP, OpenAI) are valid</li></ol><p><a href='${WORKFLOW_URL}' style='background:#dc2626;color:white;padding:10px 20px;text-decoration:none;border-radius:5px;'>View Workflow Logs</a></p><hr><p style='color:#666;font-size:12px;'>This alert was sent by the ScamDunk automated monitoring system.</p>\"
            }" && echo "Failure alert email sent" || echo "Failed to send email"

      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date().toISOString().split('T')[0];
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Enhanced Daily Evaluation Failed - ${date}`,
                body: `The enhanced daily stock evaluation workflow failed.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease check the logs and re-run if needed.`,
                labels: ['bug', 'automation']
              });
            } catch (error) {
              console.log(`Could not create issue: ${error.message}`);
              console.log('Ensure workflow has write permissions: Settings > Actions > General > Workflow permissions');
            }

  notify-on-success:
    needs: enhanced-evaluation
    runs-on: ubuntu-latest
    if: ${{ success() && (!github.event.inputs.news_shadow_scope || github.event.inputs.news_shadow_scope == 'none') && (!github.event.inputs.risk_shadow_scope || github.event.inputs.risk_shadow_scope == 'none') && (!github.event.inputs.pipeline_validation || github.event.inputs.pipeline_validation == 'none') }}
    steps:
      - name: Send success email (optional - daily digest)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_SUCCESS_EMAIL: ${{ vars.SEND_SUCCESS_EMAIL || 'false' }}
        run: |
          # Only send success emails if explicitly enabled via repository variable
          if [ "$SEND_SUCCESS_EMAIL" != "true" ]; then
            echo "Success emails disabled (set SEND_SUCCESS_EMAIL=true in repo variables to enable)"
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "$RESEND_API_KEY" ]; then
            echo "Warning: RESEND_API_KEY not set, skipping email notification"
            exit 0
          fi

          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"ScamDunk Alerts <noreply@scamdunk.com>\",
              \"to\": [\"elimizroch@gmail.com\"],
              \"subject\": \"✅ Daily Stock Scan Complete - ${DATE}\",
              \"html\": \"<h2>Daily Stock Evaluation Completed Successfully</h2><p>The enhanced daily stock scanning pipeline completed on <strong>${DATE}</strong>.</p><p>Check the <a href='${WORKFLOW_URL}'>workflow summary</a> for details on detected schemes.</p><hr><p style='color:#666;font-size:12px;'>This alert was sent by the ScamDunk automated monitoring system.</p>\"
            }" && echo "Success email sent" || echo "Failed to send email"

  notify-on-skip:
    needs: check-trading-day
    runs-on: ubuntu-latest
    if: ${{ needs.check-trading-day.outputs.is_trading_day == 'false' && github.event_name == 'schedule' }}
    steps:
      - name: Log skipped scan
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_ON_SKIP: ${{ vars.ALERT_ON_SKIP || 'false' }}
        run: |
          DATE=$(date +%Y-%m-%d)
          DAY_NAME=$(date +%A)

          echo "Scan skipped for $DATE ($DAY_NAME) - detected as non-trading day"

          # Only send skip alerts if explicitly enabled (useful for debugging holiday detection)
          if [ "$ALERT_ON_SKIP" != "true" ]; then
            echo "Skip alerts disabled (set ALERT_ON_SKIP=true in repo variables to enable)"
            exit 0
          fi

          if [ -z "$RESEND_API_KEY" ]; then
            echo "Warning: RESEND_API_KEY not set, skipping email notification"
            exit 0
          fi

          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"ScamDunk Alerts <noreply@scamdunk.com>\",
              \"to\": [\"elimizroch@gmail.com\"],
              \"subject\": \"ℹ️ Daily Stock Scan Skipped - ${DATE} (${DAY_NAME})\",
              \"html\": \"<h2>Daily Scan Skipped</h2><p>The daily stock scan was skipped on <strong>${DATE} (${DAY_NAME})</strong> because it was detected as a non-trading day (weekend or US market holiday).</p><p>If this is incorrect, you can manually trigger the workflow with <code>force_run: true</code>.</p><hr><p style='color:#666;font-size:12px;'>This alert was sent by the ScamDunk automated monitoring system.</p>\"
            }" && echo "Skip alert email sent" || echo "Failed to send email"

  news-shadow-validation:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.news_shadow_scope && github.event.inputs.news_shadow_scope != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: Elimiz21/scam-dunk-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: retained-data
      - uses: actions/cache/restore@v4
        if: ${{ github.event.inputs.resume_pipeline_cache_key == '' }}
        with:
          path: |
            evaluation/results/market-http-cache
            evaluation/results/news-cache
            evaluation/results/news-decisions
            evaluation/results/news-cost-ledger-*.jsonl
          key: provider-validation-v3-${{ github.event.inputs.date_override }}-${{ github.run_id }}
          restore-keys: provider-validation-v3-${{ github.event.inputs.date_override }}-
      - name: Resume successful source evidence from a completed validation
        if: ${{ github.event.inputs.resume_news_cache_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ github.event.inputs.resume_news_cache_run }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" --jq '.path')" = ".github/workflows/enhanced-daily-evaluation.yml"
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'news-shadow-*' --dir "$RUNNER_TEMP/news-validation-state"
          python3 - <<'PYCODE'
          import os,pathlib,shutil
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'news-validation-state'
          target=pathlib.Path('evaluation/results');(target/'news-cache').mkdir(parents=True,exist_ok=True)
          for cache in source.rglob('news-cache'):
              for entry in cache.glob('*.json'):
                  destination=target/'news-cache'/entry.name
                  if not destination.exists():shutil.copyfile(entry,destination)
          for ledger in source.rglob('news-cost-ledger-*.jsonl'):
              destination=target/ledger.name
              old=destination.read_text().splitlines() if destination.exists() else []
              known=set(old)
              for line in ledger.read_text().splitlines():
                  if line not in known:old.append(line);known.add(line)
              destination.write_text('\n'.join(old)+'\n')
          PYCODE
      - name: Run isolated news retrieval validation
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_DATE: ${{ github.event.inputs.date_override }}
          NEWS_SHADOW_SCOPE: ${{ github.event.inputs.news_shadow_scope }}
        run: |
          test -n "$EVALUATION_DATE"
          test "$NEWS_SHADOW_SCOPE" != "none"
          export NEWS_SHADOW_INPUT="$GITHUB_WORKSPACE/retained-data/evaluation-results/enhanced-evaluation-${EVALUATION_DATE}.json"
          npx ts-node --project evaluation/tsconfig.json evaluation/scripts/news-shadow-validation.ts
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            evaluation/results/market-http-cache
            evaluation/results/news-cache
            evaluation/results/news-decisions
            evaluation/results/news-cost-ledger-*.jsonl
          key: provider-validation-v3-${{ github.event.inputs.date_override }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-shadow-${{ github.event.inputs.news_shadow_scope }}-${{ github.run_id }}
          path: |
            evaluation/results/news-shadow-*.json*
            evaluation/results/news-source-requests-*.jsonl
            evaluation/results/news-model-batches-*.jsonl
            evaluation/results/news-cost-ledger-*.jsonl
            evaluation/results/news-cache/*.json
            evaluation/results/news-decisions/*.json
          retention-days: 30

  risk-shadow-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.risk_shadow_scope && github.event.inputs.risk_shadow_scope != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Acquire fresh inputs and evaluate canonical policy
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          EVALUATION_DATE: ${{ github.event.inputs.date_override }}
          RISK_SHADOW_SCOPE: ${{ github.event.inputs.risk_shadow_scope }}
        run: npx ts-node --project evaluation/tsconfig.json evaluation/scripts/risk-shadow-validation.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-shadow-${{ github.event.inputs.risk_shadow_scope }}-${{ github.run_id }}
          path: evaluation/results/risk-shadow-*.json*
          retention-days: 30

  pipeline-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline_validation && github.event.inputs.pipeline_validation != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache/restore@v4
        if: ${{ github.event.inputs.resume_pipeline_cache_key != '' }}
        with:
          path: |
            evaluation/results/market-http-cache
            evaluation/results/news-cache
            evaluation/results/news-decisions
            evaluation/results/news-cost-ledger-*.jsonl
          key: ${{ github.event.inputs.resume_pipeline_cache_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        if: ${{ github.event.inputs.resume_pipeline_cache_key == '' }}
        with:
          path: |
            evaluation/results/market-http-cache
            evaluation/results/news-cache
            evaluation/results/news-decisions
            evaluation/results/news-cost-ledger-*.jsonl
          key: provider-validation-v3-${{ github.event.inputs.date_override }}-${{ github.run_id }}
          restore-keys: |
            provider-validation-v3-${{ github.event.inputs.date_override }}-
      - name: Rehearse complete acquisition, scoring and news pipeline
        timeout-minutes: 330
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_DATE: ${{ github.event.inputs.date_override }}
          SCAMDUNK_PIPELINE_VALIDATION: "true"
          TEST_MODE: ${{ github.event.inputs.pipeline_validation == '100' && 'true' || 'false' }}
        run: |
          test -n "$EVALUATION_DATE"
          node node_modules/ts-node/dist/bin.js --project evaluation/tsconfig.json evaluation/scripts/enhanced-daily-pipeline.ts &
          PIPELINE_PID=$!
          trap 'kill -TERM "$PIPELINE_PID" 2>/dev/null || true; wait "$PIPELINE_PID" 2>/dev/null || true' INT TERM EXIT
          wait "$PIPELINE_PID"
      - name: Retain a stable acquisition snapshot
        if: always()
        run: |
          # Snapshot after the provider process has stopped; a changing directory
          # makes the cache archiver fail and loses resumable work.
          mkdir -p /tmp/scan-validation-snapshot
          for entry in market-http-cache news-cache news-decisions; do
            if [ -d "evaluation/results/$entry" ]; then
              cp -R "evaluation/results/$entry" "/tmp/scan-validation-snapshot/$entry"
            fi
          done
          cp evaluation/results/news-cost-ledger-*.jsonl /tmp/scan-validation-snapshot/ 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            evaluation/results/market-http-cache
            evaluation/results/news-cache
            evaluation/results/news-decisions
            evaluation/results/news-cost-ledger-*.jsonl
          key: provider-validation-v3-${{ github.event.inputs.date_override }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-validation-${{ github.event.inputs.pipeline_validation }}-${{ github.run_id }}
          path: |
            evaluation/results/*.json
            evaluation/results/*.jsonl
            evaluation/results/news-decisions/*.json
            evaluation/scheme-database/*.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-provider-snapshot-${{ github.run_id }}
          path: /tmp/scan-validation-snapshot
          retention-days: 30
