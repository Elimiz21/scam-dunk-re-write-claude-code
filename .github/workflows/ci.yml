name: CI

# Gates every push and PR: type-check (app + evaluation), lint, tests, and a
# production build with NO database access. Previously nothing ran here, so
# schema/type regressions were first detected by the Vercel build — which also
# mutated the production DB. This stops that.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main", "codex/unified-monitoring-dashboard-2026-09-10"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values so config/env validation and Prisma client generation pass.
      # No real database is contacted (we never run migrate/db push here).
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-in-prod"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type-check (app)
        run: npx tsc --noEmit

      - name: Type-check (evaluation pipeline)
        run: npm run typecheck:pipeline

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Production build (no DB)
        run: npm run build

  python-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  messaging-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: scamdunk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:local-test-only@127.0.0.1:5432/scamdunk_test?connection_limit=5"
      DIRECT_URL: "postgresql://postgres:local-test-only@127.0.0.1:5432/scamdunk_test"
      BOT_TEST_DATABASE: "local"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-in-prod"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Add Supabase client roles to disposable PostgreSQL
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d scamdunk_test -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - name: Generate client and apply migrations to disposable PostgreSQL
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Test Google and messaging integrations including real DB concurrency
        run: npm test -- --ci --runInBand src/tests/telegram-binding.postgres.test.ts src/tests/google-oauth.test.ts src/tests/messaging-bots.test.ts src/tests/whatsapp-delivery.test.ts
