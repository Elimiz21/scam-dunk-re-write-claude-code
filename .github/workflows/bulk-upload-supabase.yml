name: Historical Artifact Reconciliation (Dry Run)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout retained data repository
        uses: actions/checkout@v4
        with:
          repository: Elimiz21/scam-dunk-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build read-only reconciliation plan
        run: |
          find data-repo -type f \( -name "*.json" -o -name "*.md" \) -print | sort > /tmp/retained-artifacts.txt
          npx ts-node --project scripts/tsconfig.cli.json scripts/reconcile-evaluation-artifacts.ts \
            --files-from /tmp/retained-artifacts.txt \
            > historical-artifact-reconciliation.json
          cat historical-artifact-reconciliation.json

      - name: Retain reconciliation plan
        uses: actions/upload-artifact@v4
        with:
          name: historical-artifact-reconciliation-${{ github.run_id }}
          path: historical-artifact-reconciliation.json
          retention-days: 90
